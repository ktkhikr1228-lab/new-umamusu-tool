# guide_app の設定例。config.toml にコピーして使う(config.toml はコミットしない)。
# 書かなかった項目は既定値になる。

# 撮影・抽出データの置き場所(ラズパイ)
data_root = "/home/katao/uma-guide-data"
# extracted_dir = "/home/katao/uma-guide-data/extracted"
# screenshots_dir = "/home/katao/uma-guide-data/screenshots"

# 確認作業のデータ(SQLite)。ファイルをコピーすればバックアップになる
# db_path = "/home/katao/uma-guide-data/guide_app/guide.sqlite3"

# 画面の待ち受け(8080は既存のアップロード画面が使用中)
host = "0.0.0.0"
port = 8090

# 新しい抽出CSVを自動で取り込む間隔(秒)。0で無効
import_interval = 300

# 公開依頼(GitHub Actions起動)に使うトークン。既存の公開スクリプトと同じファイル
# token_file = "~/.config/uma-tool/github_token"

# ---- スクショの読み取り(複数モデルの多数決) ----
# 多数決の結果をそのまま採用する(既定はfalse=人が確認する)。
#   過半数のモデルが読み、マスタにあるスキル → 自動でOK
#   1モデルだけが読み、マスタにないスキル   → 自動で却下
#   それ以外と、撮影時の設定と中身が食い違う画像 → 人が確認する
# auto_confirm = true

# ---- 自動処理(触らなくても進むようにする)。どれも書かなければオフ ----
# 撮影が止まったら自動で読み取りを始める。最後の画像から auto_extract_idle_minutes 分たってから始める。
# 読めない画像が残ったときのやり直しは、30分以上あけて3回まで(新しく撮影すると数え直す)。
# auto_extract = true
# auto_extract_idle_minutes = 10

# 人が見る行が残っていないイベントは、自動で公開を依頼する(PRを作るところまで。マージは人が行う)。
# 未確認の行・公開できない行・設定と食い違う画像・撮り忘れの疑い・未抽出の画像が1つでもあれば依頼しない。
# 対象は、自動読み取りで読んだイベントだけ。サイトに出ているスキルの区分が変わる依頼は、自動では送らない(人が公開画面から送る)。
# auto_confirm = true と組み合わせると、撮影からPR作成までが自動になる。
# auto_publish = true

# Discordへの通知。webhookのURLを1行だけ書いたファイルを指す(URLはこのファイルやリポジトリに書かない)。
#   作り方: echo 'https://discord.com/api/webhooks/...' > ~/.config/uma-tool/discord_webhook && chmod 600 ~/.config/uma-tool/discord_webhook
# 読み取りの完了・失敗、公開依頼の送信、自動処理があきらめたときに知らせる。
# discord_webhook_file = "~/.config/uma-tool/discord_webhook"

# DBのバックアップ。1日1回 guide-YYYYMMDD.sqlite3 を作り、backup_keep 個より古いものを消す。0でバックアップしない
# backup_dir = "/home/katao/uma-guide-data/guide_app/backups"
# backup_keep = 14

# 同時に読む画像の枚数。増やすと速くなるが、回数制限に当たりやすくなる
# parallel_images = 3

# 2段階の読み取り: [[readers]] のどれか1つに primary = true を付けると、まずそのモデルだけで全画像を読み、
# 次に当てはまる画像だけを全モデル(会議)で読む。
#   マスタにない名前がある / 撮影時の設定(脚質・区分・コース)と食い違う / 1次のモデルが読めなかった / スキルが0件
# spot_check は、1次を通った画像のうち何枚に1枚を会議にも回すか(1次のモデルの間違いの量を測るため。0で行わない)
# spot_check = 5

# 撮影画像の置き場所。<イベント>/<脚質>/<区分>/ の形で入っている場所
# inbox_dir = "/home/katao/uma-guide-data/screenshots/inbox"

# 読み取りに使うモデルを [[readers]] で並べる。2つ以上で多数決になる(3つがおすすめ)。
# OpenAI互換のAPI(<base_url>/chat/completions)で、画像を読めるモデルを指定する。
# APIキーはファイルに置いて key_file で指す(このファイルやリポジトリには書かない)。環境変数なら key_env。

# Gemini(OpenAI互換の入口)
# [[readers]]
# name = "gemini"
# base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
# model = "gemini-3.5-flash-lite"
# key_file = "~/.config/uma-tool/gemini_api_key"
# min_interval = 5        # 無料枠の回数制限に当たるときは、呼び出しの間隔(秒)を空ける
# primary = true          # 2段階の読み取りで、最初に全画像を読むモデルにする

# キーを専用のヘッダーで渡すゲートウェイ(LiteLLMの前段など)は key_header でヘッダー名を指定する
# [[readers]]
# name = "gpt"
# base_url = "https://example.com/gateway/litellm/v1"
# model = "gpt-6.1-sol"
# key_file = "~/.config/uma-tool/gateway_api_key"
# key_header = "X-Gravitee-Api-Key"

# Open WebUI など、OpenAI互換のAPIを持つサーバ(同じサーバの別モデルを2つ並べてもよい)
# [[readers]]
# name = "claude"
# base_url = "https://example.com/api"
# model = "claude-opus-5.5"
# key_file = "~/.config/uma-tool/webui_api_key"

# 画面を開けるホスト名の追加分。IPアドレス・uma-pi のようなドットのない名前・Tailscaleの名前(*.ts.net)は常に開けます。
# それ以外の名前で開く場合だけ書きます(外部サイトからの不正な操作を防ぐための制限)。
# allowed_hosts = ["pi.example.com"]
