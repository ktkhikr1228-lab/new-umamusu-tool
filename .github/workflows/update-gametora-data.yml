name: Update GameTora data

on:
  workflow_dispatch:
  schedule:
    # UTC: 03:15, 06:00, 09:00, 12:00 = JST: 12:15, 15:00, 18:00, 21:00.
    # Run even when GameTora hashes are unchanged so other sites can catch up.
    - cron: "15 3 * * *"
    - cron: "0 6,9,12 * * *"

# Pi/manual/scheduled runs all update the same data PR; serialize their writes.
concurrency:
  group: gametora-data-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update cards.json from GameTora
        run: |
          python backend/tools/import_gametora_cards.py \
            --download-latest \
            --download-dir "$RUNNER_TEMP/gametora-data" \
            --no-backup > "$RUNNER_TEMP/gametora-import.json"
          cat "$RUNNER_TEMP/gametora-import.json"

      - name: Update skill_master.json from GameTora
        # 新しいスキルが追加されたら、スキル名の一覧(マスター)も自動で作り直す。
        # 公開依頼の検証と確認アプリの名前照合が、この一覧を使う。件数が急に減る場合は失敗して止まる。
        run: |
          skills_file="$(ls -t "$RUNNER_TEMP"/gametora-data/skills.*.json | head -n 1)"
          echo "skills data: $skills_file"
          python backend/tools/build_skill_master.py --input "$skills_file" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Research only cards with missing skills
        run: |
          python backend/tools/research_missing_card_skills.py \
            --import-report "$RUNNER_TEMP/gametora-import.json" \
            --skills "$RUNNER_TEMP/gametora-data"/skills.*.json \
            --summary "$RUNNER_TEMP/missing-skill-research.md"
          cat "$RUNNER_TEMP/missing-skill-research.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload missing-skill research for review
        uses: actions/upload-artifact@v4
        with:
          name: missing-skill-research
          path: |
            backend/data/missing_skill_research.json
            ${{ runner.temp }}/missing-skill-research.md
          retention-days: 30

      - name: Validate generated JSON
        run: |
          python -m json.tool frontend/src/data/cards.json > /dev/null
          python -m json.tool frontend/src/data/factor_skill_aliases.json > /dev/null
          python -m json.tool frontend/src/data/skill_master.json > /dev/null

      - name: Check whether data changed
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            frontend/src/data/cards.json \
            frontend/src/data/factor_skill_aliases.json; then
            echo "frontend_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet -- \
            frontend/src/data/cards.json \
            frontend/src/data/factor_skill_aliases.json \
            frontend/src/data/skill_master.json \
            backend/data/missing_skill_research.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.frontend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.frontend_changed == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: steps.changes.outputs.frontend_changed == 'true'
        working-directory: frontend
        run: npm run build

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "Update GameTora support card data"
          title: "Update GameTora data and missing-skill research"
          body: |
            Updated support-card data, factor-skill aliases and the skill-name master from GameTora.
            Missing-skill cards are researched individually. See backend/data/missing_skill_research.json and the workflow summary for candidate skills and source URLs.
            Research candidates are unapproved and are not applied to cards.json.
          branch: data/gametora-update
          base: main
          add-paths: |
            frontend/src/data/cards.json
            frontend/src/data/factor_skill_aliases.json
            frontend/src/data/skill_master.json
            backend/data/missing_skill_research.json
