name: Publish reviewed race skills

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Reviewed request JSON generated by publish_reviewed_race_data.py prepare'
        required: true
        type: string

# Different requests can touch the same race JSON. Serialize all publication runs.
concurrency:
  group: reviewed-race-publication
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run publication safety tests
        run: python -m unittest discover -s backend/tests -p test_publish_reviewed_race_data.py -v
      - name: Validate reviewed request
        id: request
        env:
          REVIEWED_RACE_PAYLOAD: ${{ inputs.payload }}
        run: |
          python backend/tools/publish_reviewed_race_data.py receive \
            --output "$RUNNER_TEMP/request.json" --github-output "$GITHUB_OUTPUT"
      - name: Restore requests already waiting in this event PR
        env:
          REVIEWED_BRANCH: ${{ steps.request.outputs.branch }}
          REVIEWED_EVENT: ${{ steps.request.outputs.event }}
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin "$REVIEWED_BRANCH" > "$RUNNER_TEMP/pending-ref"; then
            git fetch origin "$REVIEWED_BRANCH"
            git show "FETCH_HEAD:backend/data/reviewed_race_requests/$REVIEWED_EVENT.json" > "$RUNNER_TEMP/pending.json"
          else
            result=$?
            if [ "$result" != 2 ]; then exit "$result"; fi
          fi
      - name: Merge without removing unrelated race data
        id: data
        env:
          REVIEWED_EVENT: ${{ steps.request.outputs.event }}
        run: |
          python backend/tools/publish_reviewed_race_data.py apply \
            --input "$RUNNER_TEMP/request.json" --pending "$RUNNER_TEMP/pending.json" \
            --pending-output "backend/data/reviewed_race_requests/$REVIEWED_EVENT.json" \
            --summary "$RUNNER_TEMP/publication-summary.md" --github-output "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/publication-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: steps.data.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frozen frontend dependencies
        if: steps.data.outputs.changed == 'true'
        working-directory: frontend
        run: npm ci
      - name: Validate frontend build
        if: steps.data.outputs.changed == 'true'
        working-directory: frontend
        run: npm run build
      - name: Create or update reviewed data PR
        if: steps.data.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: main
          branch: ${{ steps.request.outputs.branch }}
          commit-message: Publish reviewed race skills
          title: Publish reviewed race skills (${{ steps.request.outputs.event }})
          body-path: ${{ runner.temp }}/publication-summary.md
          add-paths: |
            frontend/src/data/race_data.json
            backend/data/reviewed_race_requests/${{ steps.request.outputs.event }}.json
