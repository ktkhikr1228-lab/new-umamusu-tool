name: Test GameTora importer
on:
  pull_request:
    paths:
      - 'backend/tools/import_gametora_cards.py'
      - 'backend/tools/research_missing_card_skills.py'
      - '.github/workflows/update-gametora-data.yml'
      - 'backend/tests/**'
      - '.github/workflows/test-gametora-import.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s backend/tests -v
